# Change these first
owner: teasyastron # Your GitHub organization or username, where this repository lives
repo: status-page # The name of this repository

sites:
  - name: Astron
    url: https://astron.live
  - name: Rubber
    url: https://rubber.astron.live
  - name: DNF
    url: https://dnf.astron.live
  - name: CDN
    url: https://cdn.astron.live

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.astron.live
  # baseUrl: /your-repo-name
  themeUrl: https://status.astron.live/astron-theme.css
  name: "Status - astron"
  introTitle: "**Astron Status**"
  introMessage: Real-time status for our services.
  navbar: []
  customHeadHtml: |
    <title>Status - astron</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <style>
        @font-face { font-family: 'Space Mono'; src: url('assets/SpaceMono-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'Space Mono'; src: url('assets/SpaceMono-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
        @font-face { font-family: 'Archivo Black'; src: url('assets/ArchivoBlack-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
        .hero-text { position: absolute; bottom: -1.5vw; left: 0; width: 100%; text-align: center; font-family: 'Archivo Black', sans-serif; font-size: 26vw; line-height: 0.75; color: white; text-transform: lowercase; letter-spacing: -0.06em; z-index: 2; pointer-events: none; transform: scaleX(1.15); opacity: 0.25; mix-blend-mode: screen; }
    
#sapper { display: none !important; }
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background-color: #0c1b33; /* Fallback color */
    color: white;
    user-select: none;
    -webkit-user-select: none;
}

.background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('assets/bg.png'); /* The local uploaded background */
    background-size: cover;
    background-position: center bottom;
    z-index: 0;
}

.bg-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(12, 27, 51, 0.1) 0%, rgba(12, 27, 51, 0.4) 100%);
    z-index: 1;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 2rem 3rem;
    position: relative;
    z-index: 2;
}

/* --- Header & Navigation --- */
.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
}

.nav-right {
    display: flex;
    gap: 2rem;
}

.logo {
    text-transform: uppercase;
    font-weight: 700;
    font-size: 0.8rem;
}

.nav-right a {
    color: white;
    text-decoration: none;
    text-transform: uppercase;
    transition: opacity 0.3s ease;
}

.nav-right a:hover {
    opacity: 0.7;
}

/* --- Main Content (Mods List) --- */
.content {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    padding-top: 6rem;
}

.mods-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    width: fit-content;
}

.mod-item-link {
    display: block;
    text-decoration: none;
    color: inherit;
    /* Removed transition: opacity to avoid conflict with GSAP */
    transition: filter 0.3s ease;
}

.mod-item-link:hover {
    filter: brightness(70%);
}

.mod-item {
    display: grid;
    grid-template-columns: 45px 150px auto;
    gap: 1rem;
    text-transform: uppercase;
    align-items: center;
}

.mod-number {
    opacity: 0.8;
}

.mod-name {
    font-weight: 700;
}

.mod-desc {
    opacity: 0.9;
    text-align: right;
}

/* --- Hero Text (ASTRON) --- */
.hero-text {
    position: absolute;
    bottom: -1.5vw; /* Collé au bas de la page (compense l'espace sous la police) */
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'Archivo Black', sans-serif;
    font-size: 26vw;
    line-height: 0.75;
    color: white;
    text-transform: lowercase;
    letter-spacing: -0.06em;
    z-index: 2;
    pointer-events: none;
    transform: scaleX(1.15);
    opacity: 0.25; 
    mix-blend-mode: screen; /* Screen avec opacité réduite rend bien sur les couchers de soleil */
}

.mod-status-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; justify-self: end; } .mod-status-indicator.up { background-color: #10b981; box-shadow: 0 0 10px #10b981; } .mod-status-indicator.degraded { background-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; } .mod-status-indicator.down { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
</style>
  customBodyHtml: |
    <div class="background" id="custom-bg" style="display: none;">
        <div class="bg-overlay"></div>
    </div>
    <div class="container" id="custom-ui" style="display: none;">
        <header class="header">
            <div class="logo">[ASTRON]</div>
            <div class="nav-right">
                <a href="https://astron.live">HOME</a>
                <a href="mailto:hi@astron.live">CONTACT</a>
            </div>
        </header>
        <main class="content">
            <div class="mods-list" id="status-list">
                <a class="mod-item-link placeholder-item">
                    <div class="mod-item">
                        <span class="mod-number">[..]</span>
                        <span class="mod-name">LOADING</span>
                        <span class="mod-desc"></span>
                    </div>
                </a>
            </div>
        </main>
        <div class="hero-text">astron</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      if (true) {
          document.getElementById('custom-ui').style.display = 'flex';
          document.getElementById('custom-bg').style.display = 'block';
          
          const startTime = Date.now();
          gsap.from(".background", { duration: 2, opacity: 0, ease: "power2.inOut" });
          gsap.from(".header", { duration: 1.2, y: -30, opacity: 0, ease: "power3.out", delay: 0.3 });
          gsap.from(".placeholder-item", { duration: 1, y: -40, opacity: 0, stagger: 0.15, ease: "back.out(1.2)", delay: 0.8 });

          fetch('https://raw.githubusercontent.com/teasyastron/status-page/master/history/summary.json').then(r => r.json()).then(data => {
              let html = '';
              const nameMap = { 'Astron': 'astron', 'Rubber': 'Rubber', 'DNF': 'DNF Academy', 'CDN': 'astronCDN' };
              
              data.forEach((site, index) => {
                  const num = String(index + 1).padStart(2, '0');
                  const isUp = site.status === 'up';
                  const isDegraded = site.status === 'degraded';
                  const statusText = isUp ? 'Online' : (isDegraded ? 'Degraded' : 'Offline');
                  const indicatorClass = isUp ? 'up' : (isDegraded ? 'degraded' : 'down');
                  const link = site.url || '#';
                  const displayName = nameMap[site.name] || site.name;
                  const pingText = '<span style="font-size: 0.85em; opacity: 0.6; display: block; margin-top: 2px;">' + site.time + 'ms</span>';
                  
                  html += '<a href="' + link + '" class="mod-item-link dynamic-item" target="_blank">' +
                          '<div class="mod-item">' +
                              '<span class="mod-number">[' + num + ']</span>' +
                              '<span class="mod-name">' + displayName + '</span>' +
                              '<span class="mod-desc" style="text-align: right; display: flex; flex-direction: column; align-items: flex-end;">' +
                                  '<span style="display: flex; align-items: center; gap: 8px;">' + statusText + ' <span class="mod-status-indicator ' + indicatorClass + '"></span></span>' +
                                  pingText +
                              '</span>' +
                          '</div>' +
                      '</a>';
              });
              document.getElementById('status-list').innerHTML = html;
              
              const elapsed = (Date.now() - startTime) / 1000;
              let remainingDelay = 0.8 - elapsed;
              if (remainingDelay < 0) remainingDelay = 0;
              
              gsap.from(".dynamic-item", { 
                  duration: 1, 
                  y: -40, 
                  opacity: 0, 
                  stagger: 0.15, 
                  ease: "back.out(1.2)", 
                  delay: remainingDelay 
              });
          }).catch(e => {
              console.error(e);
          });
      }
    </script>

